    <!-- Start GitHub Pages Hack Script -->
    <script type="text/javascript">
      (function(l) {
        if (l.search.slice(0, 3) === '?p=') {
          var decoded = l.search.slice(3).split('&').map(function(s) {
            return s.replace(/~and~/g, '&')
          }).reduce(function(r, q) {
            var p = q.split('=');
            r[p[0]] = p[1];
            return r;
          }, {});
          if (decoded.p !== undefined) {
            window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + (decoded.p ? '/' + decoded.p : '') +
              (decoded.q ? ('?' + decoded.q) : '') +
              l.hash
            );
          }
        }
      }(window.location));
    </script>
    <!-- End GitHub Pages Hack Script -->
